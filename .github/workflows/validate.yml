# Cheap delivery validation -- runs on every push and pull request.
#
# This is the gate that catches a stale fork point / drifted patch set in
# about a minute, instead of letting three multi-hour container matrix jobs
# fail at `git am` (which is exactly what happened on 2026-09-13: the
# workflow's FORK_POINT had gone stale after the re-base onto 790cf51aa).
#
# It does NOT build anything and does NOT touch Docker/GHCR.  The tag-triggered
# GitHub Release (patch set + SHA256SUMS) lives in release.yml; the ROCm
# container images are built and pushed locally by scripts/build-containers.sh,
# not in CI.
#
# Checks (scripts/validate-set.sh, driven by release.json):
#   * no tracked path uses a character Windows forbids (a single one makes the
#     repo unclonable there -- issue #36),
#   * every patches/*.patch matches its recorded sha256,
#   * rdna-boosts-all.patch matches its recorded sha256,
#   * the set applies strictly (no 3-way fallback) on a fresh tarball of
#     release.json.base,
#   * the reconstructed base tree == release.json.base_tree,
#   * the applied tree / commit count == release.json.tree / n_blocks,
#   * no file the set ADDS calls a POSIX-only function outside a Windows-excluding
#     region (issue #231: a `close()` added to moe-expert-cache.cu in r143 is a hard
#     compile error with HIP on Windows, and no gate on a Linux box can see it).

name: Validate delivery set

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Apply and verify the patch set
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out delivery repo
        uses: actions/checkout@v5

      - name: Check tracked paths are Windows-checkout-safe
        run: bash scripts/check-windows-paths.sh

      - name: Validate against release.json
        run: bash scripts/validate-set.sh
